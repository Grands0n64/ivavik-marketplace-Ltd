<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivavik Marketplace Ltd</title>
    <!-- Tailwind CSS Engine for luxury styling -->
    <script src="https://tailwindcss.com"></script>
</head>
<!-- Premium Cream Background Colour -->
<body class="bg-[#F5F0E6] font-sans min-h-screen text-gray-800">

    <!-- 1. NAVIGATION BAR (Emerald Green) -->
    <header class="bg-[#176B57] text-white p-4 sticky top-0 shadow-md z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tight">IVAVIK <span class="text-gray-100 font-light">MARKETPLACE</span></h1>
            <div id="cart-counter" class="font-bold cursor-pointer bg-[#115242] px-4 py-2 rounded-lg text-sm transition">
                🛒 Cart (0)
            </div>
        </div>
    </header>

    <!-- 2. MAIN STOREFRONT LAYOUT -->
    <main class="max-w-6xl mx-auto p-4 mt-6">
        <h2 class="text-xl font-bold mb-6 text-[#176B57] tracking-tight">Trending Premium Products</h2>
        
        <!-- THE EMPTY GRID CONTAINER: Our JavaScript will inject all white cards here automatically -->
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
    </main>

    <!-- 3. CONNECT INDEPENDENT PRODUCT DIRECTORY -->
    <script src="products.js"></script>
    
    <!-- 4. DYNAMIC CATALOGUE INJECTION SCRIPT -->
    <script>
        // Check to ensure the products file loaded properly
        const grid = document.getElementById('product-grid');
        
        if (typeof IVAVIK_INVENTORY !== 'undefined' && IVAVIK_INVENTORY.length > 0) {
            // Loop through our array and print out clean white surface cards
            IVAVIK_INVENTORY.forEach(product => {
                const cardHtml = `
                    <div class="bg-[#FFFFFF] p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition">
                        <div class="relative bg-gray-50 rounded-lg overflow-hidden">
                            <img src="${product.img}" alt="${product.name}" class="w-full h-44 object-cover rounded-md">
                        </div>
                        <div class="mt-3 flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-[10px] uppercase font-black tracking-widest text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">${product.category}</span>
                                <h3 class="font-semibold text-sm text-gray-800 mt-2 line-clamp-2 min-h-[40px]">${product.name}</h3>
                            </div>
                            <div class="mt-4">
                                <p class="text-lg font-black text-[#176B57]">₦${product.price.toLocaleString()}</p>
                                <button onclick="alert('${product.name} added to cart!')" class="w-full mt-3 bg-[#176B57] hover:bg-[#115242] text-white text-xs font-bold py-2.5 rounded-lg transition uppercase tracking-wider">
                                    Add to Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        } else {
            // Error fallback message if products.js is empty or missing
            grid.innerHTML = '<p class="text-gray-500 text-center col-span-full">Loading marketplace products...</p>';
        }
    </script>

</body>
</html>
