<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivavik Marketplace Ltd</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
</head>
<!-- Cream Background Colour Applied Here -->
<body class="bg-[#F5F0E6] font-sans min-h-screen text-gray-800">

    <!-- 1. NAVIGATION BAR (Emerald Green) -->
    <header class="bg-[#176B57] text-white p-4 sticky top-0 shadow-md z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tight">IVAVIK <span class="text-gray-100 font-light">MARKETPLACE</span></h1>
            <div class="font-bold cursor-pointer bg-emerald-800 px-4 py-2 rounded-lg text-sm">🛒 Cart (0)</div>
        </div>
    </header>

    <!-- 2. MAIN STOREFRONT CONTAINER -->
    <main class="max-w-6xl mx-auto p-4 mt-6">
        <h2 class="text-xl font-bold mb-6 text-[#176B57]">Trending Premium Products</h2>
        
        <!-- PRODUCT GRID -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            
            <!-- PRODUCT CARD 1 (White Surface) -->
            <div class="bg-[#FFFFFF] p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition">
                <div class="relative bg-gray-50 rounded-lg overflow-hidden">
                    <img src="https://unsplash.com" alt="Watch" class="w-full h-44 object-cover">
                </div>
                <div class="mt-3">
                    <span class="text-xs uppercase font-bold tracking-wider text-gray-400">Electronics</span>
                    <h3 class="font-semibold text-sm text-gray-800 mt-1 line-clamp-1">Ivavik Luxury Smart Watch</h3>
                    <p class="text-lg font-black text-[#176B57] mt-2">₦45,000</p>
                    <!-- Emerald Green Button -->
                    <button class="w-full mt-3 bg-[#176B57] hover:bg-[#115242] text-white text-xs font-bold py-2.5 rounded-lg transition uppercase tracking-wider">Add to Cart</button>
                </div>
            </div>

            <!-- PRODUCT CARD 2 (White Surface) -->
            <div class="bg-[#FFFFFF] p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition">
                <div class="relative bg-gray-50 rounded-lg overflow-hidden">
                    <img src="https://unsplash.com" alt="Headphones" class="w-full h-44 object-cover">
                </div>
                <div class="mt-3">
                    <span class="text-xs uppercase font-bold tracking-wider text-gray-400">Electronics</span>
                    <h3 class="font-semibold text-sm text-gray-800 mt-1 line-clamp-1">Pro Noise-Cancelling Headphones</h3>
                    <p class="text-lg font-black text-[#176B57] mt-2">₦65,000</p>
                    <!-- Emerald Green Button -->
                    <button class="w-full mt-3 bg-[#176B57] hover:bg-[#115242] text-white text-xs font-bold py-2.5 rounded-lg transition uppercase tracking-wider">Add to Cart</button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
