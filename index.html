<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivavik Marketplace Ltd</title>
    <!-- This links styling so your site looks clean like Jumia -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- 1. NAVIGATION BAR -->
    <header class="bg-orange-500 text-white p-4 sticky top-0 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tight">IVAVIK <span class="text-black">MARKETPLACE</span></h1>
            <div class="font-bold cursor-pointer">🛒 Cart (0)</div>
        </div>
    </header>

    <!-- 2. MAIN STOREFRONT CONTAINER -->
    <main class="max-w-6xl mx-auto p-4 mt-6">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Trending Products</h2>
        
        <!-- PRODUCT GRID -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            
            <!-- PRODUCT 1 -->
            <div class="bg-white p-3 rounded-lg shadow hover:shadow-lg transition flex flex-col justify-between">
                <img src="https://unsplash.com" alt="Watch" class="w-full h-40 object-cover rounded">
                <div class="mt-2">
                    <h3 class="font-semibold text-sm text-gray-700 line-clamp-1">Ivavik Ultra Smart Watch</h3>
                    <p class="text-lg font-bold text-orange-600 mt-1">₦45,000</p>
                    <button class="w-full mt-2 bg-orange-500 text-white text-xs font-bold py-2 rounded hover:bg-orange-600 transition">Add to Cart</button>
                </div>
            </div>

            <!-- PRODUCT 2 -->
            <div class="bg-white p-3 rounded-lg shadow hover:shadow-lg transition flex flex-col justify-between">
                <img src="https://unsplash.com" alt="Headphones" class="w-full h-40 object-cover rounded">
                <div class="mt-2">
                    <h3 class="font-semibold text-sm text-gray-700 line-clamp-1">Premium Wireless Headphones</h3>
                    <p class="text-lg font-bold text-orange-600 mt-1">₦65,000</p>
                    <button class="w-full mt-2 bg-orange-500 text-white text-xs font-bold py-2 rounded hover:bg-orange-600 transition">Add to Cart</button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
